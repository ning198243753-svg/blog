# ============================================================
# Nginx 配置
#
# 【这个文件承担四件事】
# 1. 把静态文件直接返回（ADR-01：纯 SPA，不经应用层）
# 2. 把 /api 转发给后端容器（ADR-04：同源，不配 CORS）
# 3. 把 /uploads 直接返回图片文件（ADR-02，不经 FastAPI）
# 4. HTTPS 终止与 HTTP → HTTPS 跳转
#
# 【一个改动会影响全站的地方】
# 静态文件的 Cache-Control。见下面 location /assets/ 的说明 ——
# 设错的表现是「改了代码，用户还是看到旧页面」或者
# 「每次访问都重新下载全部资源」。这两种都很难自查。
# ============================================================

# ---- 上游：后端容器 ----
# 名字 backend 由 docker-compose 的服务名提供，
# Docker 内置 DNS 会解析成容器 IP。
# 写容器名而不是 IP：容器重建后 IP 会变，写 IP 会在重启后失效。
upstream blog_backend {
    server backend:8000;
    # 单实例，不需要负载均衡策略。
    # keepalive 减少每次请求重建 TCP 连接的开销。
    keepalive 16;
}

# ---- HTTP：只做跳转，不提供任何内容 ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME 挑战必须走 HTTP 且不能被跳转（见下方 location）。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # 证书路径由 certbot 挂载进来（见 docker-compose.yml）
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Let's Encrypt 的推荐参数。
    # ssl_session_cache 让重复访问省掉一次完整握手 ——
    # 对 3Mbps 的链路，握手的往返开销占比不低。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头 ----
    #
    # 【nosniff 为什么重要】
    # 浏览器会「猜」Content-Type。如果没有这个头，
    # 一个被上传的、内容其实不是图片的文件可能被当成 HTML 执行。
    # 我们的上传接口已经验证了真实格式，但这是纵深防御。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 【HSTS 的代价必须先说清楚】
    # 一旦浏览器收到这个头，在 max-age 期间**强制**用 HTTPS 访问本站，
    # 而且用户无法点击「继续访问」绕过。
    # 如果证书后来出问题（比如忘记续期），站点会彻底无法访问，
    # 必须等 max-age 过期或让用户手工清理 HSTS 缓存。
    #
    # 所以这里先设一个较短的时间（1 天）。确认 HTTPS 稳定运行几周后，
    # 再逐步调大（常见最终值是 31536000 = 1 年）。
    # 【不要一上来就写 1 年】—— 那是配置模板里的常见做法，
    # 但它把「证书配置出错」的代价从「浏览器警告」放大成「站点无法访问」。
    add_header Strict-Transport-Security "max-age=86400" always;

    # ---- 请求体大小 ----
    # 上传接口限制 2MB（config.py 的 upload_max_size_mb），
    # 这里给到 4MB 留出 multipart 包装的开销。
    # 【为什么不能省掉这一行】Nginx 默认上限是 1MB，
    # 超过会直接返回 413 —— 请求根本到不了 FastAPI，
    # 应用层的 40005 错误码永远不会出现，排查时容易找错方向。
    client_max_body_size 4m;

    # ---- 静态文件根目录 ----
    root /usr/share/nginx/html;
    index index.html;

    # ---- SPA 路由回退 ----
    #
    # 【try_files 是 history 模式能工作的前提】
    # 前端用 createWebHistory（ADR-07），URL 形如 /posts/xxx。
    # 用户直接访问或刷新这个地址时，Nginx 收到的是 /posts/xxx ——
    # 磁盘上并没有这个文件。不做回退就是 404。
    #
    # 回退到 index.html 后由前端路由接管并渲染正确页面。
    #
    # 这也意味着「不存在的文章」必须由前端显示 404 页面 ——
    # 后端对不存在的文章返回 404，而 Nginx 对这一类路径总是返回 200。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 带哈希的构建产物：可以长期缓存 ----
    #
    # 【为什么敢设 immutable 和一年】
    # Vite 构建出的文件名里含内容哈希（如 index-DU8Kcap6.js），
    # 内容变了文件名就会变。所以同一个 URL 的内容永不改变，
    # 缓存一年完全安全。
    #
    # 这是首屏性能的关键：访客第二次访问时这些文件直接来自本地缓存，
    # 一个字节都不用传 —— 对 3Mbps 的带宽尤为重要。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---- index.html：绝不能缓存 ----
    #
    # 【这一条如果写错，表现为「部署了新版本但用户看不到」】
    # index.html 是入口，它引用带哈希的资源文件名。
    # 如果它被缓存了，用户拿到的还是旧 HTML，指向旧的文件名 ——
    # 即使服务器上已经是新版本，用户看到的仍是旧页面，
    # 而且刷新也无效（缓存还没过期）。
    #
    # no-cache 不是「不缓存」，而是「每次都要向服务器确认」——
    # 配合 ETag 就是「没变就返回 304」，既保证新鲜又不浪费带宽。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- 上传的图片：长期缓存 ----
    #
    # 【为什么由 Nginx 直接返回而不经过 FastAPI（ADR-02）】
    # 图片是纯静态文件，让 Python 进程读文件再写进响应体，
    # 会白占一个工作进程去处理它，而 worker 数量有限。
    # 图片数量一多，「加载图片慢」和「接口慢」会互相影响。
    #
    # 文件名是随机串且扩展名固定为 .webp（上传时就确定的），
    # 所以同一个 URL 的内容不会变，可以放心长期缓存。
    #
    # 【关于正则与 alias 的坑 —— 这里踩过】
    # 下面的 location 用了正则（~*），此时 alias **必须**写成
    # 目标目录的完整路径，且 Nginx 会把「正则匹配到的那一段」
    # 整体替换掉。写成 alias /data/uploads/; 且正则匹配整个
    # ^/uploads/.*\.webp$ 时，拼接结果仍是对的；
    # 但如果正则只匹配一部分（比如改成 \.webp$），
    # 拼接出的路径就会变成 /data/uploads/xxx.webp 之外的怪路径。
    #
    # 所以这里让正则**匹配完整路径**（^/uploads/...），
    # 这样 alias 的替换语义最直观，也不依赖 Nginx 的隐式行为。
    #
    # 【为什么用「白名单扩展名」而不是「黑名单拒绝脚本」】
    # 黑名单永远列不全（.phtml、.php5、.php~ ...）。
    # 上传接口只产出 .webp，所以只放行图片扩展名，
    # 其余一律不提供 —— 漏掉某个脚本扩展名也不会变成可执行文件。
    location ~* ^/uploads/[^/]+\.(webp|jpg|jpeg|png|gif)$ {
        alias /data/uploads/;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 其他 /uploads/ 路径：一律 404。
    #
    # 【为什么是 404 而不是 403】
    # 403 等于告诉探测者「这个文件存在但不让看」，
    # 404 连存在性都不透露。
    #
    # 【路径穿越防护在这里】
    # 上面那个白名单正则用了 [^/]+，它不接受斜杠，
    # 所以 /uploads/../etc/passwd 这类路径**根本匹配不上**，
    # 会落到这条 404 上。
    # 用正则的字符类做防护，比写 `if ($request_uri ~* "\.\.")`
    # 更可靠 —— 后者是 Nginx 社区公认容易出错的做法
    # （if 在 location 里的求值时机与预期不符）。
    location /uploads/ {
        return 404;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;

        # 【这几个头必须传】
        # Host：应用生成绝对 URL 时需要；
        # X-Real-IP / X-Forwarded-For：应用要记录真实客户端 IP；
        # X-Forwarded-Proto：应用要知道原始请求是 https，
        #   否则它可能生成 http 链接，或者在设置 Cookie 时判断错误。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keepalive（与 upstream 里的 keepalive 配合）
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 【上传接口需要更长的读超时】
        # 在 3Mbps 的链路上传 2MB 图片，最慢可能要 10 秒以上。
        # 60 秒的默认值够用，但这里显式写出来，
        # 避免将来有人把上面的值调小后忘记这里。
        location /api/admin/upload {
            proxy_pass http://blog_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            client_max_body_size 4m;
        }
    }

    # ---- 压缩 ----
    #
    # 【为什么这对本项目格外重要】
    # 单机 3Mbps 上行带宽，首屏预算 150KB（NFR-14）。
    # JSON 响应和 HTML 的压缩率通常在 70% 以上 ——
    # 这是不需要改代码就能拿到的最大收益。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;   # 太小的响应压缩后可能更大
    gzip_comp_level 5;      # 6 以上收益递减而 CPU 开销明显增加
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 【不要压缩图片】
    # WebP / JPEG / PNG 已经是压缩格式，再压一遍几乎不减小体积，
    # 却要消耗 CPU。这也是上面 gzip_types 里不含 image/* 的原因。

    # ---- 隐藏文件 ----
    # 拒绝访问 .git、.env 之类的路径。
    # 正常部署不会把它们放进 web root，但这条规则的成本接近于零。
    location ~ /\. {
        deny all;
    }
}
